<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img">
<title>Floor build-up — what each purchased item is</title>
<desc>Cross-section at the wall edge. Bottom up: hardcore, blinding, damp-proof membrane, slab with steel on chairs. At the wall a compressible XPS strip separates slab from sill, sealed on top, open below to a ventilation gap.</desc>
