<!doctype html>
<meta charset="utf-8">
<title>Dārza iela 10 — structural model</title>
<style>
  :root { --ink:#1f2328; --panel:rgba(255,255,255,.92); }
  * { box-sizing:border-box; }
  body { margin:0; overflow:hidden; font:13px/1.45 ui-sans-serif,system-ui,sans-serif; color:var(--ink); }
  canvas { display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid #d0d7de;
           border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  #ctl { top:14px; left:14px; width:210px; }
  #ctl h1 { font-size:13px; margin:0 0 2px; letter-spacing:.02em; }
  #ctl .sub { color:#57606a; font-size:11px; margin-bottom:10px; }
  #ctl h2 { font-size:10px; text-transform:uppercase; letter-spacing:.09em;
            color:#57606a; margin:12px 0 6px; font-weight:600; }
  label { display:flex; align-items:center; gap:6px; padding:1px 0; cursor:pointer; }
  .key { display:inline-block; min-width:15px; font-weight:700; font-size:11px;
         color:#8a3a00; text-align:center; }
  .views { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .views button { font:inherit; padding:5px; border:1px solid #d0d7de; background:#fff;
                  border-radius:6px; cursor:pointer; }
  .views button:hover { background:#f3f4f6; }
  #readout { bottom:14px; left:14px; }
  #readout .ok  { color:#1a7f37; }
  #readout .bad { color:#d1242f; }
  #finding { top:14px; right:14px; width:290px; display:none; }
  #screws-panel { bottom:14px; right:14px; width:330px; max-height:70vh;
                  overflow:auto; display:none; }
  #screws-panel.on { display:block; }
  #screws-panel h3 { margin:0 0 8px; font-size:12px; letter-spacing:.03em; }
  #screws-panel h4 { margin:10px 0 4px; font-size:11px; color:#8a3a00;
                     text-transform:uppercase; letter-spacing:.07em; }
  #screws-panel ul { margin:0; padding:0 0 0 2px; list-style:none; }
  #screws-panel li { padding:2px 0; border-bottom:1px solid #eef1f4; }
  #screws-panel .m { font-weight:700; color:#8a3a00; }
  #screws-panel .s { color:#57606a; font-size:11px; display:block; }
  #finding.on { display:block; }
  #finding h3 { margin:7px 0 5px; font-size:13px; }
  #finding p { margin:0 0 8px; }
  #finding small { color:#57606a; }
  .sev { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
         padding:2px 7px; border-radius:20px; color:#fff; font-weight:600; }
  .sev.critical{background:#d1242f}.sev.high{background:#e36209}
  .sev.medium{background:#d4a72c}.sev.low{background:#57606a}
  .legend { font-size:11px; color:#57606a; margin-top:4px; }
  .swatch { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; }
</style>

<div class="panel" id="ctl">
  <h1>Dārza iela 10, Sigulda</h1>
  <div class="sub">Mazēka · as-built 2026-08-14</div>

  <h2>Layers</h2>
  <div id="layers"></div>

  <h2>Overlays</h2>
  <label><input type="checkbox" id="approved"> approved envelope</label>
  <label><input type="checkbox" id="markers" checked> findings</label>
  <label><input type="checkbox" id="screws"> screw schedule</label>
  <div class="legend">
    <b>Colour = can you build it today?</b><br><span class="swatch" style="background:#4f8fbf"></span>blue = material is in the yard<br><span class="swatch" style="background:#f5c518"></span>yellow = has to be bought<br><span class="swatch" style="background:#f5f7fa;border:1px solid #b0b6bd"></span>white = steel (bolts, straps)<br><span class="swatch" style="background:#8a6a45"></span>brown = already standing
  </div>

  <h2>Views</h2>
  <div class="views">
    <button id="v_iso">iso</button><button id="v_plan">plan</button>
    <button id="v_front">front</button><button id="v_side">side</button>
  </div>
</div>

<div class="panel" id="readout"></div>
<div class="panel" id="finding"></div>
<div class="panel" id="screws-panel"></div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>
